<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>回到 Doo</title>
    <link rel="icon" href="../../logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../site.css">
    <link rel="stylesheet" href="callback.css">
    <script src="callback.js" defer></script>
  </head>
  <body>
    <main class="holding callback" aria-labelledby="site-name" aria-describedby="status">
      <img class="mascot" src="../../logo.svg" alt="" width="120" height="120" aria-hidden="true">
      <h1 id="site-name" class="wordmark">
        <img src="../../wordmark.svg" alt="Doo" width="216" height="84">
      </h1>
      <p id="status" class="status" role="status" aria-live="polite">请回到 App 查看连接结果</p>
      <a class="callback-action" href="doo://open" id="open-doo">返回 Doo</a>
    </main>
  </body>
</html>
